openapi: 3.0.3

info:
  title: WikiLive API
  version: 1.0.0

servers:
  - url: http://localhost:8085
    description: Local
  - url: https://wiki-live.ru
    description: Production
  - url: https://www.wiki-live.ru
    description: Production

security:
  - basicAuth: []

paths:
  /api/pages:
    get:
      tags:
        - Pages
      summary: Get all pages
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    post:
      tags:
        - Pages
      summary: Create page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}:
    get:
      tags:
        - Pages
      summary: Get page by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    put:
      tags:
        - Pages
      summary: Update page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    delete:
      tags:
        - Pages
      summary: Delete page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/backlinks:
    get:
      tags:
        - Pages
      summary: Get backlinks
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/PageDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/graph:
    get:
      tags:
        - Pages
      summary: Get graph
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/search:
    get:
      tags:
        - Pages
      summary: Search pages
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-zA-Z0-9 _-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/PageDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/tree:
    get:
      tags:
        - Pages
      summary: Get page tree
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/comments:
    get:
      tags:
        - Comments
      summary: Get comments for page
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentThreadDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/comments/threads:
    post:
      tags:
        - Comments
      summary: Create comment thread
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentThreadRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentThreadDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/comments/import:
    post:
      tags:
        - Comments
      summary: Import comment threads
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommentThreadsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentThreadDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/comments/{threadId}/messages:
    post:
      tags:
        - Comments
      summary: Add comment message
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentThreadDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/comments/{threadId}:
    patch:
      tags:
        - Comments
      summary: Update comment thread
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentThreadRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentThreadDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/comments/{threadId}/messages/{messageId}:
    patch:
      tags:
        - Comments
      summary: Update comment message
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentThreadDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/editors:
    post:
      tags:
        - Permissions
      summary: Add page editor
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/editors/{editorUsername}:
    delete:
      tags:
        - Permissions
      summary: Remove page editor
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
        - name: editorUsername
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/versions:
    get:
      tags:
        - Versions
      summary: Get page version history
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageVersionDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/versions/all:
    get:
      tags:
        - Versions
      summary: Get all page versions including drafts
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageVersionDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/versions/{versionId}:
    get:
      tags:
        - Versions
      summary: Get specific page version
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVersionDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/versions/{versionId}/restore:
    post:
      tags:
        - Versions
      summary: Restore page version
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: comment
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/draft:
    post:
      tags:
        - Versions
      summary: Save draft
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    get:
      tags:
        - Versions
      summary: Get draft for page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVersionDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    delete:
      tags:
        - Versions
      summary: Delete draft
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/draft/publish:
    post:
      tags:
        - Versions
      summary: Publish draft
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
        - name: comment
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

components:
  schemas:
    WikiPage:
      type: object
      description: Full page entity with content and links
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 255
          pattern: "^[a-zA-Z0-9 _-]+$"
        slug:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9-]+$"
        content:
          type: string
          maxLength: 10000
        mwsTableId:
          type: string
          maxLength: 255
          nullable: true
        ownerId:
          type: string
          maxLength: 255
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'

    PageLink:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        targetSlug:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9-]+$"

    PageDTO:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9-]+$"
        title:
          type: string
          maxLength: 255
          pattern: "^[a-zA-Z0-9 _-]+$"
        parentSlug:
          type: string
          maxLength: 255
          nullable: true

    GraphDTO:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              title:
                type: string
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string

    PageRequest:
      type: object
      required:
        - title
        - content
      additionalProperties: false
      properties:
        title:
          type: string
        content:
          type: string
        mwsTableId:
          type: string
          nullable: true

    DraftRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        content:
          type: string
        changeComment:
          type: string
          nullable: true

    PageVersionDTO:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        versionNumber:
          type: integer
        title:
          type: string
        content:
          type: string
        authorUsername:
          type: string
        createdAt:
          type: string
          format: date-time
        isDraft:
          type: boolean
        changeComment:
          type: string
          nullable: true

    CommentAuthorDTO:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        handle:
          type: string

    CommentMessageDTO:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/CommentAuthorDTO'
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        edited:
          type: boolean
        replyToId:
          type: integer
          format: int64
          nullable: true
        likes:
          type: integer
          nullable: true
        likedByMe:
          type: boolean
        deleted:
          type: boolean

    CommentThreadDTO:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        quote:
          type: string
        top:
          type: number
        height:
          type: integer
        right:
          type: integer
        status:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentMessageDTO'

    CreateCommentThreadRequest:
      type: object
      required:
        - quote
        - text
      additionalProperties: false
      properties:
        quote:
          type: string
          maxLength: 220
        text:
          type: string
          maxLength: 256
        top:
          type: number
          minimum: 0.0
        height:
          type: integer
          minimum: 0
          maximum: 400
        right:
          type: integer
          minimum: 0

    AddCommentMessageRequest:
      type: object
      required:
        - text
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 256
        replyToId:
          type: integer
          format: int64
          nullable: true

    UpdateCommentThreadRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          pattern: "^(OPEN|RESOLVED)$"

    UpdateCommentMessageRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 256
        deleted:
          type: boolean
        likes:
          type: integer

    ImportCommentThreadsRequest:
      type: object
      required:
        - threads
      additionalProperties: false
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/ImportCommentThreadRequest'

    ImportCommentThreadRequest:
      type: object
      additionalProperties: false
      properties:
        quote:
          type: string
          maxLength: 220
        top:
          type: number
          minimum: 0.0
        height:
          type: integer
          minimum: 0
          maximum: 400
        right:
          type: integer
          minimum: 0
        status:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ImportCommentMessageRequest'

    ImportCommentMessageRequest:
      type: object
      additionalProperties: false
      properties:
        author:
          $ref: '#/components/schemas/CommentAuthorDTO'
        text:
          type: string
          maxLength: 256
        edited:
          type: boolean
        replyToId:
          type: integer
          format: int64
          nullable: true
        likes:
          type: integer
          nullable: true
        deleted:
          type: boolean

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
        code:
          type: string

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
