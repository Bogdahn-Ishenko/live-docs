openapi: 3.0.3

info:
  title: WikiLive API
  version: 1.0.0

servers:
  - url: http://localhost:8085
    description: Local

security:
  - basicAuth: []

paths:
  /api/pages:
    get:
      tags:
        - Pages
      summary: Get all pages
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    post:
      tags:
        - Pages
      summary: Create page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}:
    get:
      tags:
        - Pages
      summary: Get page by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    put:
      tags:
        - Pages
      summary: Update page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

    delete:
      tags:
        - Pages
      summary: Delete page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/{slug}/backlinks:
    get:
      tags:
        - Pages
      summary: Get backlinks
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/PageDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/graph:
    get:
      tags:
        - Pages
      summary: Get graph
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

  /api/pages/search:
    get:
      tags:
        - Pages
      summary: Search pages
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: "^[a-zA-Z0-9 _-]+$"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/PageDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        'default':
          $ref: '#/components/responses/Error'

components:
  schemas:
    WikiPage:
      type: object
      description: Full page entity with content and links
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 255
          pattern: "^[a-zA-Z0-9 _-]+$"
        slug:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9-]+$"
        content:
          type: string
          maxLength: 10000
        mwsTableId:
          type: string
          maxLength: 255
          nullable: true
        ownerId:
          type: string
          maxLength: 255
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'

    PageLink:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        targetSlug:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9-]+$"

    PageDTO:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9-]+$"
        title:
          type: string
          maxLength: 255
          pattern: "^[a-zA-Z0-9 _-]+$"

    GraphDTO:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              title:
                type: string
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string

    PageRequest:
      type: object
      required:
        - title
        - content
      additionalProperties: false
      properties:
        title:
          type: string
        content:
          type: string
        mwsTableId:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
        code:
          type: string

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic